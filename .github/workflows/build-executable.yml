name: Build executables (Linux + Windows)

# PyInstaller no compila entre plataformas: un binario de Windows solo se puede
# generar en Windows y uno de Linux en Linux. Por eso esto corre en una matriz
# con un runner de cada sistema, y no en un único job.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        # Se instalan desde `pyproject.toml`: si se listaran aquí a mano,
        # cualquier dependencia nueva se olvidaría y el build saldría sin ella.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Instalar librerías de Qt (Linux)
        # PySide6 enlaza contra libGL, libEGL y libxkbcommon-x11, que un runner
        # Ubuntu sin escritorio no trae: el import muere con "ImportError:
        # libGL.so.1: cannot open shared object file". Sin esto también falla
        # el propio PyInstaller, que importa PySide6 para localizar sus plugins.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0

      - name: Comprobar que el código importa
        # Falla aquí, en segundos, y no diez minutos después dentro del binario.
        # Van en invocaciones separadas para que el log diga cuál falla en vez
        # de una traza donde no se sabe qué import reventó.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import core.model_specs; print('core OK')"
          python -c "import ui.theme; print('ui.theme OK')"
          python -c "import main; print('main OK')"

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm AutoML_MEC_Desktop.spec

      - name: Comprobar que los recursos van dentro
        # Ya pasó una vez: el .spec sin `datas` genera un ejecutable que arranca
        # y muere con FileNotFoundError al pintar el escudo, y eso no se ve
        # hasta que alguien lo abre. Se comprueba contra el paquete, no contra
        # `dist/`: se exige que TODO fichero de `resources/` esté dentro, así
        # que añadir un recurso sin empaquetarlo rompe aquí.
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          raiz = pathlib.Path(".")
          toc = next(raiz.glob("build/*/PKG-00.toc"))
          # `PKG-00.toc` se escribe con `repr()`, así que en Windows una barra
          # invertida aparece duplicada en el texto: `resources\\icono-app.svg`.
          # Sustituir solo `\` por `/` dejaba `resources//icono-app.svg` y no
          # coincidía nunca. Se colapsan las secuencias de barras a una sola.
          texto = re.sub(r"[\\/]+", "/", toc.read_text(encoding="utf-8", errors="replace"))
          recursos = sorted(p.name for p in (raiz / "resources").iterdir() if p.is_file())
          faltan = [n for n in recursos if f"resources/{n}" not in texto]
          if faltan:
              muestra = [l for l in texto.splitlines() if "resources" in l][:5]
              sys.exit(
                  f"RECURSOS SIN EMPAQUETAR: {faltan}\n"
                  f"Entradas de resources en el TOC:\n" + "\n".join(muestra)
              )
          print(f"{len(recursos)} recursos empaquetados: {', '.join(recursos)}")
          PY

      - name: Empaquetar Linux
        # `upload-artifact` y las releases no conservan el bit ejecutable, así
        # que en Linux se sube un tar.gz: descargar el binario suelto deja un
        # fichero que hay que hacer ejecutable a mano antes de abrirlo.
        if: runner.os == 'Linux'
        run: tar -czf dist/AutoML-Desktop-linux-x86_64.tar.gz -C dist AutoML_MEC_Desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoML-Desktop-${{ runner.os }}
          path: |
            dist/AutoML_MEC_Desktop.exe
            dist/AutoML-Desktop-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    needs: build
    # Solo con tags: el disparo manual sirve para probar el build, no para
    # publicar. Y va en un job aparte porque si cada runner de la matriz
    # creara la release a la vez, competirían por la misma y una fallaría.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Recoger los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Crear el borrador
        uses: softprops/action-gh-release@v2
        with:
          # `draft: true` deja la release sin publicar hasta que se revise.
          draft: true
          generate_release_notes: true
          files: artefactos/*
