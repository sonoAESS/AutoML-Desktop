name: Build executables (Linux + Windows)

# PyInstaller no compila entre plataformas: un binario de Windows solo se puede
# generar en Windows y uno de Linux en Linux. Por eso esto corre en una matriz
# con un runner de cada sistema, y no en un único job.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-22.04`, no `ubuntu-latest`. PyInstaller copia bibliotecas del
        # sistema donde compila (`libsqlite3`, `libstdc++`), así que el runner
        # decide el glibc mínimo del ejecutable. Compilando en 24.04 (2.39) el
        # binario deja de arrancar en Lubuntu 22.04 y no se nota hasta que lo
        # prueba un usuario. 22.04 da 2.35, que es el suelo declarado.
        os: [ubuntu-22.04, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        # Se instalan desde `pyproject.toml`: si se listaran aquí a mano,
        # cualquier dependencia nueva se olvidaría y el build saldría sin ella.
        # El extra `[smote]` no es opcional en el ejecutable: sin él, elegir
        # SMOTE en la interfaz lanzaba ModuleNotFoundError, porque `imblearn`
        # se importa dentro de una función y PyInstaller no empaqueta lo que
        # no está instalado.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[smote]"
          # PyInstaller fijado: el formato del `.spec` cambia entre versiones.
          pip install pyinstaller==6.22.3 pytest==9.1.1

      - name: Instalar librerías de Qt (Linux)
        # PySide6 enlaza contra libGL, libEGL y libxkbcommon-x11, que un runner
        # Ubuntu sin escritorio no trae: el import muere con "ImportError:
        # libGL.so.1: cannot open shared object file". Sin esto también falla
        # el propio PyInstaller, que importa PySide6 para localizar sus plugins.
        # Son las mismas que necesita el usuario si instala Lubuntu sin entorno.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 \
            binutils

      - name: Comprobar que el código importa
        # Falla aquí, en segundos, y no diez minutos después dentro del binario.
        # Van en invocaciones separadas para que el log diga cuál falla en vez
        # de una traza donde no se sabe qué import reventó.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import core.model_specs; print('core OK')"
          python -c "import ui.theme; print('ui.theme OK')"
          python -c "import main; print('main OK')"

      - name: Probar la interfaz sin pantalla
        # Construye la ventana de verdad y comprueba que el icono SVG y el
        # escudo se cargan. Es lo único que detecta un plugin `qsvg` ausente,
        # que no da error: deja el icono vacío y la ventana sale sin él.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_ui_smoke.py

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm AutoML_MEC_Desktop.spec

      - name: Comprobar el suelo de glibc (Linux)
        # El ejecutable tiene que arrancar en Lubuntu 22.04 (glibc 2.35). Esta
        # comprobación existe porque el fallo es invisible: se compila igual,
        # se publica igual y solo revienta en la máquina del usuario.
        #
        # Se mira el paquete ya montado en `dist/`, no un TOC intermedio: en
        # modo carpeta `PKG-00.toc` solo describe el lanzador y la lista real
        # de ficheros queda repartida. `dist/` es lo que se publica.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          MAX_GLIBC = (2, 35, 0)
          MAX_GLIBCXX = (3, 4, 30)
          RAIZ = pathlib.Path("dist/AutoML_MEC_Desktop")


          def version(texto):
              partes = [int(x) for x in texto.split(".")][:3]
              return tuple(partes + [0] * (3 - len(partes)))


          peor = {"GLIBC": ((0, 0, 0), ""), "GLIBCXX": ((0, 0, 0), "")}
          for ruta in RAIZ.rglob("*"):
              if not ruta.is_file() or ruta.is_symlink():
                  continue
              try:
                  with open(ruta, "rb") as fh:
                      if fh.read(4) != b"\x7fELF":
                          continue
              except OSError:
                  continue
              try:
                  salida = subprocess.run(
                      ["readelf", "-V", str(ruta)],
                      capture_output=True, text=True, timeout=60,
                  ).stdout
              except Exception:
                  continue
              necesita = salida.split("Version needs", 1)[-1].split("Version definition", 1)[0]
              for prefijo in ("GLIBC", "GLIBCXX"):
                  for valor in re.findall(rf"Name: {prefijo}_([0-9.]+)", necesita):
                      actual = version(valor)
                      if actual > peor[prefijo][0]:
                          peor[prefijo] = (actual, ruta.name)

          fallos = []
          for clave, maximo in (("GLIBC", MAX_GLIBC), ("GLIBCXX", MAX_GLIBCXX)):
              actual, quien = peor[clave]
              print(f"  {clave} máxima: {'.'.join(map(str, actual))} ({quien})")
              if actual > maximo:
                  fallos.append(f"{clave} {'.'.join(map(str, actual))} en {quien}")
          if fallos:
              sys.exit(
                  "El binario pide más que el suelo declarado (GLIBC 2.35 / "
                  "GLIBCXX 3.4.30) y no arrancaría en Lubuntu 22.04: "
                  + ", ".join(fallos)
              )
          print("  cabe en Lubuntu 22.04")
          PY

      - name: Comprobar que los recursos van dentro
        # Ya pasó una vez: el .spec sin `datas` genera un ejecutable que arranca
        # y muere con FileNotFoundError al pintar el escudo, y eso no se ve
        # hasta que alguien lo abre.
        #
        # Solo se exigen los dos recursos que usa `resource_path`. El `.ico`
        # (icono del ejecutable) y el `.png` (su fuente) se quedan fuera a
        # propósito.
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import sys

          recursos = pathlib.Path("dist/AutoML_MEC_Desktop/_internal/resources")
          faltan = [
              n for n in ("escudo-mec.png", "icono-app.svg")
              if not (recursos / n).is_file()
          ]
          if faltan:
              sys.exit(f"RECURSOS SIN EMPAQUETAR: {faltan} (mirado en {recursos})")
          print("recursos empaquetados:", ", ".join(p.name for p in recursos.iterdir()))
          PY

      - name: Probar el binario construido
        # Abre el paquete real con la plataforma offscreen: comprueba que los
        # plugins quedaron dentro, que no sobran los recortados y que el
        # proceso sigue vivo quince segundos después.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_binary_smoke.py

      - name: Empaquetar Windows
        # En modo carpeta el ejecutable necesita `_internal/` al lado: si se
        # publicara el `.exe` suelto, no arrancaría. Se sube un zip que
        # contiene la carpeta entera.
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive -Path dist/AutoML_MEC_Desktop
          -DestinationPath dist/AutoML-Desktop-windows-x64.zip

      - name: Empaquetar Linux
        # `upload-artifact` y las releases no conservan el bit ejecutable, así
        # que en Linux se sube un tar.gz: descargar el binario suelto deja un
        # fichero que hay que hacer ejecutable a mano antes de abrirlo.
        if: runner.os == 'Linux'
        run: tar -czf dist/AutoML-Desktop-linux-x86_64.tar.gz -C dist AutoML_MEC_Desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoML-Desktop-${{ runner.os }}
          path: |
            dist/AutoML-Desktop-windows-x64.zip
            dist/AutoML-Desktop-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    needs: build
    # Solo con tags: el disparo manual sirve para probar el build, no para
    # publicar. Y va en un job aparte porque si cada runner de la matriz
    # creara la release a la vez, competirían por la misma y una fallaría.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Recoger los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Crear el borrador
        uses: softprops/action-gh-release@v2
        with:
          # `draft: true` deja la release sin publicar hasta que se revise.
          draft: true
          generate_release_notes: true
          files: artefactos/*
