[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-desktop"
version = "0.2.0"
description = "AutoML Desktop: clasificación y regresión sin programar"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "odfpy>=1.4",
]

[project.optional-dependencies]
smote = ["imbalanced-learn>=0.11"]
dev = [
    "pytest>=7.4",
    "black>=24.1",
    "isort>=5.13",
    "coverage>=7.4",
    "xlwt>=1.3",
]

[project.scripts]
automl-desktop = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88