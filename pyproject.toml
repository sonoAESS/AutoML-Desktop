[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-desktop"
version = "1.0.2"
description = "AutoML Desktop: clasificación y regresión sin programar"
# Se exige 3.12 porque las versiones fijadas de abajo están probadas ahí: con
# 3.10 `numpy==2.5.3` ni siquiera resuelve. Un rango más ancho daría la
# impresión de que instala, y fallaría a medio camino.
requires-python = ">=3.12"
# Versiones exactas, no rangos. PySide6 marca el suelo de glibc del ejecutable
# (6.11 exige 2.34); si un día una 6.12 exige más, el binario dejaría de
# arrancar en Lubuntu 22.04 sin que el CI se entere. Con `==` hay que subirlo a
# mano y volver a comprobar.
dependencies = [
    "PySide6==6.11.2",
    "pandas==2.2.3",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "joblib==1.6.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "odfpy==1.4.1",
]

[project.optional-dependencies]
# El CI instala este extra: sin él, elegir SMOTE en el ejecutable lanzaba
# ModuleNotFoundError porque `imblearn` se importa dentro de una función y
# PyInstaller no podía empaquetar lo que no estaba instalado.
smote = ["imbalanced-learn==0.14.2"]
dev = [
    "pytest==9.1.1",
    "black==26.5.1",
    "isort==9.0.2",
    "coverage==7.16.2",
    "xlwt==1.3.0",
]

[project.scripts]
automl-desktop = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88